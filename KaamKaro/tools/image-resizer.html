<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Image Resizer - KaamKaro</title>

    <meta
        name="description"
        content="Resize images to custom dimensions with KaamKaro."
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        .tool-page {
            max-width: 900px;
            margin: auto;
            padding: 60px 20px 100px;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .tool-big-icon {
            width: 70px;
            height: 70px;
            margin: auto auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background: #fff4e5;

            font-size: 32px;
        }

        .tool-header h2 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .tool-header p {
            color: var(--muted);
        }

        .resizer-box {
            background: white;
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: var(--shadow);
        }

        .upload-area {
            display: block;

            border: 2px dashed #d9d4f5;
            border-radius: 20px;

            padding: 50px 20px;

            text-align: center;

            cursor: pointer;

            background: #faf9ff;

            transition: 0.2s;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: #f7f5ff;
        }

        .upload-icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .upload-area h3 {
            margin-bottom: 8px;
        }

        .upload-area p {
            color: var(--muted);
            font-size: 14px;
        }

        #imageInput {
            display: none;
        }

        .workspace {
            display: none;
            margin-top: 30px;
        }

        .preview-area {
            background: #f7f7fb;
            border: 1px solid var(--border);
            border-radius: 18px;

            padding: 15px;

            text-align: center;
        }

        .preview-area img {
            width: 100%;
            max-height: 380px;

            object-fit: contain;

            border-radius: 12px;

            background: white;
        }

        .original-info {
            margin-top: 12px;
            color: var(--muted);
            font-size: 13px;
        }

        .settings {
            margin-top: 25px;
        }

        .settings h3 {
            margin-bottom: 15px;
        }

        .dimension-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .input-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 700;
        }

        .input-group input {
            width: 100%;

            padding: 14px;

            border: 1px solid var(--border);

            border-radius: 12px;

            outline: none;

            font-size: 15px;
        }

        .input-group input:focus {
            border-color: var(--primary);
        }

        .ratio-row {
            display: flex;
            align-items: center;

            gap: 10px;

            margin-top: 15px;

            padding: 14px;

            background: #f7f7fb;

            border-radius: 12px;
        }

        .ratio-row input {
            accent-color: var(--primary);
        }

        .ratio-row label {
            font-size: 14px;
            font-weight: 600;
        }

        .presets {
            margin-top: 25px;
        }

        .presets h4 {
            margin-bottom: 12px;
        }

        .preset-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
        }

        .preset-button {
            border: 1px solid var(--border);

            background: white;

            padding: 10px 13px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 13px;
        }

        .preset-button:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .resize-button {
            width: 100%;

            margin-top: 25px;

            padding: 16px;

            border: none;

            border-radius: 15px;

            background: var(--primary);

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;
        }

        .resize-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            display: none;

            margin-top: 25px;

            padding: 20px;

            background: #f1fff7;

            border: 1px solid #cceedd;

            border-radius: 18px;
        }

        .result-info {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;

            margin-top: 15px;
        }

        .result-item {
            padding: 15px;

            background: white;

            border-radius: 12px;
        }

        .result-item small {
            display: block;

            color: var(--muted);

            margin-bottom: 4px;
        }

        .download-button {
            display: block;

            width: 100%;

            margin-top: 18px;

            padding: 15px;

            border-radius: 14px;

            background: #171525;

            color: white;

            text-decoration: none;

            text-align: center;

            font-weight: 700;
        }

        .reset-button {
            width: 100%;

            padding: 13px;

            margin-top: 10px;

            border: 1px solid var(--border);

            background: white;

            border-radius: 14px;

            cursor: pointer;

            font-weight: 600;
        }

        .error {
            display: none;

            margin-top: 15px;

            padding: 14px;

            background: #fff0f0;

            color: #c62828;

            border-radius: 12px;

            font-size: 14px;
        }

        @media (max-width: 600px) {

            .tool-page {
                padding-top: 40px;
            }

            .tool-header h2 {
                font-size: 30px;
            }

            .resizer-box {
                padding: 18px;
            }

            .dimension-grid {
                grid-template-columns: 1fr;
            }

            .result-info {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <div class="logo">

        <a
            href="../index.html"
            style="
                text-decoration:none;
                color:inherit;
                display:flex;
                align-items:center;
                gap:12px;
            "
        >

            <div class="logo-icon">
                K
            </div>

            <div>

                <h1>KaamKaro</h1>

                <p>Digital Tools</p>

            </div>

        </a>

    </div>

</header>



<main>

<section class="tool-page">


    <div class="tool-header">

        <div class="tool-big-icon">
            ✂️
        </div>

        <h2>
            Image Resizer
        </h2>

        <p>
            Resize your image to any dimension.
        </p>
<button
    id="favoriteButton"
    class="favorite-button"
>
    ☆ Add to Favorites
</button>
    </div>



    <div class="resizer-box">


        <!-- UPLOAD -->

        <label
            class="upload-area"
            for="imageInput"
        >

            <div class="upload-icon">
                🖼️
            </div>

            <h3>
                Select an image
            </h3>

            <p>
                JPG, PNG or WebP
            </p>

            <p>
                Click to browse
            </p>

        </label>


        <input
            type="file"
            id="imageInput"
            accept="image/jpeg,image/png,image/webp"
        >


        <!-- ERROR -->

        <div
            class="error"
            id="errorBox"
        ></div>


        <!-- WORKSPACE -->

        <div
            class="workspace"
            id="workspace"
        >


            <!-- PREVIEW -->

            <div class="preview-area">

                <img
                    id="previewImage"
                    alt="Selected image"
                >

                <div
                    class="original-info"
                    id="originalInfo"
                >
                    -
                </div>

            </div>



            <!-- SETTINGS -->

            <div class="settings">

                <h3>
                    Resize Settings
                </h3>


                <div class="dimension-grid">


                    <div class="input-group">

                        <label>
                            Width (px)
                        </label>

                        <input
                            type="number"
                            id="widthInput"
                            min="1"
                            max="10000"
                        >

                    </div>


                    <div class="input-group">

                        <label>
                            Height (px)
                        </label>

                        <input
                            type="number"
                            id="heightInput"
                            min="1"
                            max="10000"
                        >

                    </div>

                </div>


                <div class="ratio-row">

                    <input
                        type="checkbox"
                        id="ratioLock"
                        checked
                    >

                    <label for="ratioLock">
                        Maintain aspect ratio
                    </label>

                </div>



                <!-- PRESETS -->

                <div class="presets">

                    <h4>
                        Quick Presets
                    </h4>

                    <div class="preset-buttons">

                        <button
                            class="preset-button"
                            data-width="1080"
                            data-height="1080"
                        >
                            1080 × 1080
                        </button>

                        <button
                            class="preset-button"
                            data-width="1080"
                            data-height="1920"
                        >
                            1080 × 1920
                        </button>

                        <button
                            class="preset-button"
                            data-width="1920"
                            data-height="1080"
                        >
                            1920 × 1080
                        </button>

                        <button
                            class="preset-button"
                            data-width="1280"
                            data-height="720"
                        >
                            1280 × 720
                        </button>

                        <button
                            class="preset-button"
                            data-width="800"
                            data-height="800"
                        >
                            800 × 800
                        </button>

                    </div>

                </div>


                <button
                    class="resize-button"
                    id="resizeButton"
                >
                    Resize Image
                </button>

            </div>

        </div>



        <!-- RESULT -->

        <div
            class="result"
            id="result"
        >

            <h3>
                ✅ Image Resized Successfully
            </h3>


            <div class="result-info">


                <div class="result-item">

                    <small>
                        Original
                    </small>

                    <strong id="originalDimensions">
                        -
                    </strong>

                </div>


                <div class="result-item">

                    <small>
                        New Size
                    </small>

                    <strong id="newDimensions">
                        -
                    </strong>

                </div>


            </div>


            <a
                id="downloadButton"
                class="download-button"
                download="kaamkaro-resized-image.jpg"
            >
                Download Image
            </a>


            <button
                class="reset-button"
                id="resetButton"
            >
                Resize Another Image
            </button>

        </div>


    </div>

</section>

</main>



<script>


const imageInput =
    document.getElementById(
        "imageInput"
    );

const workspace =
    document.getElementById(
        "workspace"
    );

const previewImage =
    document.getElementById(
        "previewImage"
    );

const originalInfo =
    document.getElementById(
        "originalInfo"
    );

const widthInput =
    document.getElementById(
        "widthInput"
    );

const heightInput =
    document.getElementById(
        "heightInput"
    );

const ratioLock =
    document.getElementById(
        "ratioLock"
    );

const resizeButton =
    document.getElementById(
        "resizeButton"
    );

const result =
    document.getElementById(
        "result"
    );

const originalDimensions =
    document.getElementById(
        "originalDimensions"
    );

const newDimensions =
    document.getElementById(
        "newDimensions"
    );

const downloadButton =
    document.getElementById(
        "downloadButton"
    );

const resetButton =
    document.getElementById(
        "resetButton"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );


let selectedFile = null;

let imageObject = null;

let originalWidth = 0;

let originalHeight = 0;

let aspectRatio = 1;

let resizedUrl = null;



function showError(message) {

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}


function hideError() {

    errorBox.style.display =
        "none";

}



imageInput.addEventListener(
    "change",
    () => {

        hideError();


        const file =
            imageInput.files[0];


        if (!file) {
            return;
        }


        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            showError(
                "Please select a valid image."
            );

            return;

        }


        if (
            file.size >
            20 * 1024 * 1024
        ) {

            showError(
                "Please select an image smaller than 20 MB."
            );

            return;

        }


        selectedFile =
            file;


        const url =
            URL.createObjectURL(
                file
            );


        const image =
            new Image();


        image.onload =
            () => {

                imageObject =
                    image;

                originalWidth =
                    image.naturalWidth;

                originalHeight =
                    image.naturalHeight;


                aspectRatio =
                    originalWidth /
                    originalHeight;


                previewImage.src =
                    url;


                widthInput.value =
                    originalWidth;

                heightInput.value =
                    originalHeight;


                originalInfo.textContent =
                    `${originalWidth} × ${originalHeight}px`;


                workspace.style.display =
                    "block";


                result.style.display =
                    "none";

            };


        image.onerror =
            () => {

                showError(
                    "Could not load this image."
                );

            };


        image.src =
            url;

    }
);



widthInput.addEventListener(
    "input",
    () => {

        if (
            ratioLock.checked &&
            widthInput.value
        ) {

            const width =
                Number(
                    widthInput.value
                );


            const height =
                Math.round(
                    width /
                    aspectRatio
                );


            heightInput.value =
                height;

        }

    }
);



heightInput.addEventListener(
    "input",
    () => {

        if (
            ratioLock.checked &&
            heightInput.value
        ) {

            const height =
                Number(
                    heightInput.value
                );


            const width =
                Math.round(
                    height *
                    aspectRatio
                );


            widthInput.value =
                width;

        }

    }
);



document
    .querySelectorAll(
        ".preset-button"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    const width =
                        Number(
                            button.dataset.width
                        );

                    const height =
                        Number(
                            button.dataset.height
                        );


                    ratioLock.checked =
                        false;


                    widthInput.value =
                        width;

                    heightInput.value =
                        height;

                }
            );

        }
    );



resizeButton.addEventListener(
    "click",
    () => {

        if (
            !imageObject
        ) {

            showError(
                "Please select an image first."
            );

            return;

        }


        const width =
            Number(
                widthInput.value
            );

        const height =
            Number(
                heightInput.value
            );


        if (
            !width ||
            !height ||
            width < 1 ||
            height < 1
        ) {

            showError(
                "Please enter valid dimensions."
            );

            return;

        }


        if (
            width > 10000 ||
            height > 10000
        ) {

            showError(
                "Maximum dimension is 10,000 pixels."
            );

            return;

        }


        resizeButton.disabled =
            true;

        resizeButton.textContent =
            "Resizing...";


        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.width =
            width;

        canvas.height =
            height;


        const context =
            canvas.getContext(
                "2d"
            );


        context.imageSmoothingEnabled =
            true;

        context.imageSmoothingQuality =
            "high";


        context.drawImage(
            imageObject,
            0,
            0,
            width,
            height
        );


        canvas.toBlob(
            blob => {

                if (!blob) {

                    showError(
                        "Could not resize the image."
                    );

                    resizeButton.disabled =
                        false;

                    resizeButton.textContent =
                        "Resize Image";

                    return;

                }


                if (resizedUrl) {

                    URL.revokeObjectURL(
                        resizedUrl
                    );

                }


                resizedUrl =
                    URL.createObjectURL(
                        blob
                    );


                originalDimensions.textContent =
                    `${originalWidth} × ${originalHeight}px`;


                newDimensions.textContent =
                    `${width} × ${height}px`;


                downloadButton.href =
                    resizedUrl;


                result.style.display =
                    "block";


                resizeButton.disabled =
                    false;

                resizeButton.textContent =
                    "Resize Image";

            },
            "image/jpeg",
            0.92
        );

    }
);



resetButton.addEventListener(
    "click",
    () => {

        if (resizedUrl) {

            URL.revokeObjectURL(
                resizedUrl
            );

            resizedUrl = null;

        }


        imageInput.value = "";

        selectedFile = null;

        imageObject = null;

        workspace.style.display =
            "none";

        result.style.display =
            "none";

        hideError();

    }
);


</script>

<script src="../js/app.js"></script>
</body>

</html>
