<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Image to Text - KaamKaro</title>

    <meta
        name="description"
        content="Extract text from images using OCR with KaamKaro."
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <!-- Tesseract.js -->
    <script
        src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js">
    </script>


    <style>

        .tool-page {
            max-width: 950px;
            margin: auto;
            padding: 60px 20px 100px;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .tool-big-icon {
            width: 70px;
            height: 70px;

            margin: auto auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background: #eeeeff;

            font-size: 32px;
        }

        .tool-header h2 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .tool-header p {
            color: var(--muted);
        }

        .ocr-box {
            background: white;

            border: 1px solid var(--border);

            border-radius: 24px;

            padding: 30px;

            box-shadow: var(--shadow);
        }

        .upload-area {
            display: block;

            border: 2px dashed #d9d4f5;

            border-radius: 20px;

            padding: 50px 20px;

            text-align: center;

            cursor: pointer;

            background: #faf9ff;

            transition: 0.2s;
        }

        .upload-area:hover {
            border-color: var(--primary);

            background: #f7f5ff;
        }

        .upload-icon {
            font-size: 42px;

            margin-bottom: 10px;
        }

        .upload-area h3 {
            margin-bottom: 8px;
        }

        .upload-area p {
            color: var(--muted);

            font-size: 14px;
        }

        #imageInput {
            display: none;
        }

        .workspace {
            display: none;

            margin-top: 30px;
        }

        .preview {
            background: #f7f7fb;

            border: 1px solid var(--border);

            border-radius: 18px;

            padding: 15px;

            text-align: center;
        }

        .preview img {
            width: 100%;

            max-height: 400px;

            object-fit: contain;

            border-radius: 12px;

            background: white;
        }

        .language-row {
            margin-top: 20px;
        }

        .language-row label {
            display: block;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 8px;
        }

        .language-row select {
            width: 100%;

            padding: 14px;

            border: 1px solid var(--border);

            border-radius: 12px;

            background: white;

            font-size: 14px;

            outline: none;
        }

        .extract-button {
            width: 100%;

            margin-top: 20px;

            padding: 16px;

            border: none;

            border-radius: 15px;

            background: var(--primary);

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;
        }

        .extract-button:disabled {
            opacity: 0.55;

            cursor: not-allowed;
        }

        .progress-box {
            display: none;

            margin-top: 20px;

            padding: 18px;

            background: #f7f7fb;

            border-radius: 15px;

            text-align: center;
        }

        .progress-text {
            color: var(--muted);

            font-size: 14px;

            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100%;

            height: 8px;

            background: #e8e7ef;

            border-radius: 50px;

            overflow: hidden;
        }

        .progress-fill {
            width: 0%;

            height: 100%;

            background: var(--primary);

            transition: width 0.2s;
        }

        .result {
            display: none;

            margin-top: 25px;
        }

        .result-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 10px;
        }

        .result-header h3 {
            font-size: 19px;
        }

        .copy-button {
            border: 1px solid var(--border);

            background: white;

            padding: 9px 13px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: 700;
        }

        #outputText {
            width: 100%;

            min-height: 280px;

            resize: vertical;

            padding: 16px;

            border: 1px solid var(--border);

            border-radius: 15px;

            outline: none;

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                monospace;

            font-size: 14px;

            line-height: 1.6;
        }

        .result-actions {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

            margin-top: 12px;
        }

        .download-button,
        .reset-button {
            padding: 14px;

            border-radius: 13px;

            cursor: pointer;

            font-weight: 700;

            text-align: center;
        }

        .download-button {
            background: #171525;

            color: white;

            border: none;

            text-decoration: none;
        }

        .reset-button {
            background: white;

            border: 1px solid var(--border);
        }

        .error {
            display: none;

            margin-top: 15px;

            padding: 14px;

            background: #fff0f0;

            color: #c62828;

            border-radius: 12px;

            font-size: 14px;
        }

        @media (max-width: 600px) {

            .tool-page {
                padding-top: 40px;
            }

            .tool-header h2 {
                font-size: 30px;
            }

            .ocr-box {
                padding: 18px;
            }

            .result-actions {
                grid-template-columns: 1fr;
            }

            .result-header {
                align-items: flex-start;

                gap: 10px;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <div class="logo">

        <a
            href="../index.html"
            style="
                text-decoration:none;
                color:inherit;
                display:flex;
                align-items:center;
                gap:12px;
            "
        >

            <div class="logo-icon">
                K
            </div>

            <div>

                <h1>KaamKaro</h1>

                <p>Digital Tools</p>

            </div>

        </a>

    </div>

</header>



<main>

<section class="tool-page">


    <div class="tool-header">

        <div class="tool-big-icon">
            📷
        </div>

        <h2>
            Image to Text
        </h2>

        <p>
            Extract editable text from your images.
        </p>
<button
    id="favoriteButton"
    class="favorite-button"
>
    ☆ Add to Favorites
</button>
    </div>



    <div class="ocr-box">


        <!-- UPLOAD -->

        <label
            class="upload-area"
            for="imageInput"
        >

            <div class="upload-icon">
                📤
            </div>

            <h3>
                Select an image
            </h3>

            <p>
                JPG, PNG or WebP
            </p>

            <p>
                Click to browse
            </p>

        </label>


        <input
            type="file"
            id="imageInput"
            accept="image/jpeg,image/png,image/webp"
        >


        <!-- ERROR -->

        <div
            class="error"
            id="errorBox"
        ></div>



        <!-- WORKSPACE -->

        <div
            class="workspace"
            id="workspace"
        >


            <div class="preview">

                <img
                    id="previewImage"
                    alt="Image selected for OCR"
                >

            </div>



            <!-- LANGUAGE -->

            <div class="language-row">

                <label>
                    Text Language
                </label>

                <select
                    id="language"
                >

                    <option value="eng">
                        English
                    </option>

                    <option value="hin">
                        Hindi
                    </option>

                    <option value="eng+hin">
                        English + Hindi
                    </option>

                </select>

            </div>



            <button
                class="extract-button"
                id="extractButton"
            >
                Extract Text
            </button>



            <!-- PROGRESS -->

            <div
                class="progress-box"
                id="progressBox"
            >

                <div
                    class="progress-text"
                    id="progressText"
                >
                    Preparing OCR...
                </div>


                <div class="progress-bar">

                    <div
                        class="progress-fill"
                        id="progressFill"
                    ></div>

                </div>

            </div>



            <!-- RESULT -->

            <div
                class="result"
                id="result"
            >

                <div class="result-header">

                    <h3>
                        📝 Extracted Text
                    </h3>

                    <button
                        class="copy-button"
                        id="copyButton"
                    >
                        Copy
                    </button>

                </div>


                <textarea
                    id="outputText"
                    placeholder="Extracted text will appear here..."
                ></textarea>


                <div class="result-actions">

                    <button
                        type="button"
                        class="download-button"
                        id="downloadButton"
                    >
                        Download TXT
                    </button>


                    <button
                        class="reset-button"
                        id="resetButton"
                    >
                        Extract Another Image
                    </button>

                </div>

            </div>

        </div>

    </div>

</section>

</main>



<script>


const imageInput =
    document.getElementById(
        "imageInput"
    );

const workspace =
    document.getElementById(
        "workspace"
    );

const previewImage =
    document.getElementById(
        "previewImage"
    );

const language =
    document.getElementById(
        "language"
    );

const extractButton =
    document.getElementById(
        "extractButton"
    );

const progressBox =
    document.getElementById(
        "progressBox"
    );

const progressText =
    document.getElementById(
        "progressText"
    );

const progressFill =
    document.getElementById(
        "progressFill"
    );

const result =
    document.getElementById(
        "result"
    );

const outputText =
    document.getElementById(
        "outputText"
    );

const copyButton =
    document.getElementById(
        "copyButton"
    );

const downloadButton =
    document.getElementById(
        "downloadButton"
    );

const resetButton =
    document.getElementById(
        "resetButton"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );


let selectedFile = null;

let imageUrl = null;

let downloadUrl = null;



function showError(message) {

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}


function hideError() {

    errorBox.style.display =
        "none";

}



imageInput.addEventListener(
    "change",
    () => {

        hideError();


        const file =
            imageInput.files[0];


        if (!file) {
            return;
        }


        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            showError(
                "Please select a valid image."
            );

            return;

        }


        if (
            file.size >
            15 * 1024 * 1024
        ) {

            showError(
                "Please select an image smaller than 15 MB."
            );

            return;

        }


        selectedFile =
            file;


        if (imageUrl) {

            URL.revokeObjectURL(
                imageUrl
            );

        }


        imageUrl =
            URL.createObjectURL(
                file
            );


        previewImage.src =
            imageUrl;


        workspace.style.display =
            "block";


        result.style.display =
            "none";

    }
);



extractButton.addEventListener(
    "click",
    async () => {

        if (!selectedFile) {

            showError(
                "Please select an image first."
            );

            return;

        }


        extractButton.disabled =
            true;

        extractButton.textContent =
            "Extracting...";


        progressBox.style.display =
            "block";

        progressFill.style.width =
            "0%";


        result.style.display =
            "none";


        try {

            const selectedLanguage =
                language.value;


            const worker =
                await Tesseract.createWorker(
                    selectedLanguage
                );


            const {
                data
            } =
                await worker.recognize(
                    selectedFile,
                    {
                        logger:
                            message => {

                                if (
                                    message.status
                                ) {

                                    progressText.textContent =
                                        message.status;

                                }


                                if (
                                    typeof message.progress ===
                                    "number"
                                ) {

                                    progressFill.style.width =
                                        (
                                            message.progress *
                                            100
                                        ) + "%";

                                }

                            }
                    }
                );


            await worker.terminate();


            const text =
                data.text.trim();


            outputText.value =
                text ||
                "No readable text was found in this image.";


            result.style.display =
                "block";


            progressFill.style.width =
                "100%";


            progressText.textContent =
                "Completed";


        } catch (error) {

            console.error(error);


            showError(
                "OCR failed. Please try a clearer image and try again."
            );

        } finally {

            extractButton.disabled =
                false;

            extractButton.textContent =
                "Extract Text";

        }

    }
);



copyButton.addEventListener(
    "click",
    async () => {

        const text =
            outputText.value;


        if (!text) {
            return;
        }


        try {

            await navigator.clipboard.writeText(
                text
            );


            copyButton.textContent =
                "Copied ✓";


            setTimeout(
                () => {

                    copyButton.textContent =
                        "Copy";

                },
                1500
            );


        } catch {

            outputText.select();

            document.execCommand(
                "copy"
            );

            copyButton.textContent =
                "Copied ✓";

        }

    }
);



downloadButton.addEventListener(
    "click",
    event => {

        event.preventDefault();


        const text =
            outputText.value;


        if (!text) {
            return;
        }


        const blob =
            new Blob(
                [text],
                {
                    type:
                        "text/plain;charset=utf-8"
                }
            );


        if (downloadUrl) {

            URL.revokeObjectURL(
                downloadUrl
            );

        }


        downloadUrl =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            downloadUrl;

        link.download =
            "kaamkaro-extracted-text.txt";


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();

    }
);



resetButton.addEventListener(
    "click",
    () => {

        if (imageUrl) {

            URL.revokeObjectURL(
                imageUrl
            );

            imageUrl = null;

        }


        if (downloadUrl) {

            URL.revokeObjectURL(
                downloadUrl
            );

            downloadUrl = null;

        }


        imageInput.value = "";

        selectedFile = null;

        workspace.style.display =
            "none";

        result.style.display =
            "none";

        progressBox.style.display =
            "none";

        outputText.value =
            "";

        progressFill.style.width =
            "0%";

        hideError();

    }
);


</script>

<script src="../js/app.js"></script>
</body>

</html>
