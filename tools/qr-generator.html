<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QR Generator - KaamKaro</title>

    <meta
        name="description"
        content="Generate QR codes for URLs, text and Wi-Fi with KaamKaro."
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


    <style>

        .tool-page {
            max-width: 900px;
            margin: auto;
            padding: 60px 20px 100px;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .tool-big-icon {
            width: 70px;
            height: 70px;

            margin: auto auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background: #f0eaff;

            font-size: 32px;
        }

        .tool-header h2 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .tool-header p {
            color: var(--muted);
        }

        .qr-box {
            max-width: 700px;
            margin: auto;

            background: white;

            border: 1px solid var(--border);

            border-radius: 24px;

            padding: 30px;

            box-shadow: var(--shadow);
        }

        .qr-tabs {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-bottom: 25px;
        }

        .qr-tab {
            padding: 13px;

            border: 1px solid var(--border);

            background: white;

            border-radius: 12px;

            cursor: pointer;

            font-weight: 700;

            color: var(--muted);
        }

        .qr-tab.active {
            background: #eeeaff;

            border-color: #d8d0ff;

            color: var(--primary);
        }

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 700;
        }

        .field input,
        .field textarea {
            width: 100%;

            padding: 14px;

            border: 1px solid var(--border);

            border-radius: 12px;

            outline: none;

            font-family: inherit;

            font-size: 14px;

            resize: vertical;
        }

        .field input:focus,
        .field textarea:focus {
            border-color: var(--primary);
        }

        .wifi-fields {
            display: none;
        }

        .generate-button {
            width: 100%;

            padding: 16px;

            border: none;

            border-radius: 15px;

            background: var(--primary);

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;
        }

        .generate-button:hover {
            background: var(--primary-dark);
        }

        .qr-result {
            display: none;

            margin-top: 30px;

            padding: 25px;

            background: #f7f7fb;

            border-radius: 20px;

            text-align: center;
        }

        #qrcode {
            width: 256px;
            height: 256px;

            margin: 20px auto;

            display: flex;

            align-items: center;
            justify-content: center;

            background: white;

            border-radius: 12px;
        }

        #qrcode img,
        #qrcode canvas {
            max-width: 100%;
            max-height: 100%;
        }

        .qr-actions {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;
        }

        .action-button {
            padding: 14px;

            border-radius: 12px;

            border: none;

            cursor: pointer;

            font-weight: 700;
        }

        .download-button {
            background: #171525;

            color: white;
        }

        .share-button {
            background: white;

            border: 1px solid var(--border);
        }

        .error {
            display: none;

            margin-bottom: 15px;

            padding: 14px;

            background: #fff0f0;

            color: #c62828;

            border-radius: 12px;

            font-size: 14px;
        }

        @media (max-width: 600px) {

            .tool-page {
                padding-top: 40px;
            }

            .tool-header h2 {
                font-size: 30px;
            }

            .qr-box {
                padding: 18px;
            }

            .qr-tabs {
                grid-template-columns: 1fr;
            }

            .qr-actions {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <div class="logo">

        <a
            href="../index.html"
            style="
                text-decoration:none;
                color:inherit;
                display:flex;
                align-items:center;
                gap:12px;
            "
        >

            <div class="logo-icon">
                K
            </div>

            <div>

                <h1>KaamKaro</h1>

                <p>Digital Tools</p>

            </div>

        </a>

    </div>

</header>



<main>

<section class="tool-page">


    <div class="tool-header">

        <div class="tool-big-icon">
            🔳
        </div>

        <h2>
            QR Generator
        </h2>

        <p>
            Create QR codes for URLs, text and Wi-Fi.
        </p>
<button
    id="favoriteButton"
    class="favorite-button"
>
    ☆ Add to Favorites
</button>
    </div>



    <div class="qr-box">


        <!-- TABS -->

        <div class="qr-tabs">

            <button
                class="qr-tab active"
                data-type="url"
            >
                🔗 URL
            </button>

            <button
                class="qr-tab"
                data-type="text"
            >
                📝 Text
            </button>

            <button
                class="qr-tab"
                data-type="wifi"
            >
                📶 Wi-Fi
            </button>

        </div>


        <!-- ERROR -->

        <div
            class="error"
            id="errorBox"
        ></div>



        <!-- URL -->

        <div
            class="field"
            id="urlField"
        >

            <label>
                Website URL
            </label>

            <input
                type="url"
                id="urlInput"
                placeholder="https://example.com"
            >

        </div>



        <!-- TEXT -->

        <div
            class="field"
            id="textField"
            style="display:none;"
        >

            <label>
                Your Text
            </label>

            <textarea
                id="textInput"
                rows="5"
                placeholder="Enter your text..."
            ></textarea>

        </div>



        <!-- WIFI -->

        <div
            class="wifi-fields"
            id="wifiFields"
        >

            <div class="field">

                <label>
                    Wi-Fi Name
                </label>

                <input
                    type="text"
                    id="wifiName"
                    placeholder="My Wi-Fi"
                >

            </div>


            <div class="field">

                <label>
                    Password
                </label>

                <input
                    type="text"
                    id="wifiPassword"
                    placeholder="Wi-Fi password"
                >

            </div>


            <div class="field">

                <label>
                    Security
                </label>

                <select
                    id="wifiSecurity"
                    style="
                        width:100%;
                        padding:14px;
                        border:1px solid var(--border);
                        border-radius:12px;
                        font-size:14px;
                    "
                >

                    <option value="WPA">
                        WPA/WPA2
                    </option>

                    <option value="WEP">
                        WEP
                    </option>

                    <option value="nopass">
                        No Password
                    </option>

                </select>

            </div>

        </div>



        <button
            class="generate-button"
            id="generateButton"
        >
            Generate QR Code
        </button>



        <!-- RESULT -->

        <div
            class="qr-result"
            id="qrResult"
        >

            <h3>
                Your QR Code
            </h3>


            <div
                id="qrcode"
            ></div>


            <div class="qr-actions">

                <button
                    class="action-button download-button"
                    id="downloadButton"
                >
                    Download PNG
                </button>


                <button
                    class="action-button share-button"
                    id="shareButton"
                >
                    Share
                </button>

            </div>

        </div>


    </div>

</section>

</main>



<script>


const tabs =
    document.querySelectorAll(
        ".qr-tab"
    );


const urlField =
    document.getElementById(
        "urlField"
    );

const textField =
    document.getElementById(
        "textField"
    );

const wifiFields =
    document.getElementById(
        "wifiFields"
    );


const urlInput =
    document.getElementById(
        "urlInput"
    );

const textInput =
    document.getElementById(
        "textInput"
    );

const wifiName =
    document.getElementById(
        "wifiName"
    );

const wifiPassword =
    document.getElementById(
        "wifiPassword"
    );

const wifiSecurity =
    document.getElementById(
        "wifiSecurity"
    );


const generateButton =
    document.getElementById(
        "generateButton"
    );

const qrResult =
    document.getElementById(
        "qrResult"
    );

const qrCode =
    document.getElementById(
        "qrcode"
    );

const downloadButton =
    document.getElementById(
        "downloadButton"
    );

const shareButton =
    document.getElementById(
        "shareButton"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );


let currentType =
    "url";


let currentQrCanvas =
    null;



function showError(message) {

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}


function hideError() {

    errorBox.style.display =
        "none";

}



tabs.forEach(
    tab => {

        tab.addEventListener(
            "click",
            () => {

                tabs.forEach(
                    item =>
                        item.classList.remove(
                            "active"
                        )
                );


                tab.classList.add(
                    "active"
                );


                currentType =
                    tab.dataset.type;


                urlField.style.display =
                    currentType === "url"
                        ? "block"
                        : "none";


                textField.style.display =
                    currentType === "text"
                        ? "block"
                        : "none";


                wifiFields.style.display =
                    currentType === "wifi"
                        ? "block"
                        : "none";


                qrResult.style.display =
                    "none";


                hideError();

            }
        );

    }
);



function escapeWifi(value) {

    return value
        .replace(/\\/g, "\\\\")
        .replace(/;/g, "\\;")
        .replace(/,/g, "\\,")
        .replace(/:/g, "\\:");

}



generateButton.addEventListener(
    "click",
    () => {

        hideError();


        let data = "";


        if (
            currentType === "url"
        ) {

            data =
                urlInput.value.trim();


            if (!data) {

                showError(
                    "Please enter a website URL."
                );

                return;

            }


            try {

                new URL(data);

            } catch {

                showError(
                    "Please enter a valid URL."
                );

                return;

            }

        }


        if (
            currentType === "text"
        ) {

            data =
                textInput.value.trim();


            if (!data) {

                showError(
                    "Please enter some text."
                );

                return;

            }

        }


        if (
            currentType === "wifi"
        ) {

            const ssid =
                wifiName.value.trim();

            const password =
                wifiPassword.value;

            const security =
                wifiSecurity.value;


            if (!ssid) {

                showError(
                    "Please enter the Wi-Fi name."
                );

                return;

            }


            data =
                `WIFI:T:${security};S:${escapeWifi(ssid)};P:${escapeWifi(password)};;`;

        }


        qrCode.innerHTML = "";


        new QRCode(
            qrCode,
            {
                text: data,

                width: 256,

                height: 256,

                colorDark: "#171525",

                colorLight: "#ffffff",

                correctLevel:
                    QRCode.CorrectLevel.H
            }
        );


        qrResult.style.display =
            "block";


        setTimeout(
            () => {

                currentQrCanvas =
                    qrCode.querySelector(
                        "canvas"
                    );

            },
            100
        );

    }
);



downloadButton.addEventListener(
    "click",
    () => {

        if (
            !currentQrCanvas
        ) {

            const image =
                qrCode.querySelector(
                    "img"
                );


            if (!image) {
                return;
            }


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                image.src;

            link.download =
                "kaamkaro-qr.png";

            link.click();

            return;

        }


        const link =
            document.createElement(
                "a"
            );


        link.href =
            currentQrCanvas.toDataURL(
                "image/png"
            );

        link.download =
            "kaamkaro-qr.png";

        link.click();

    }
);



shareButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                navigator.share
            ) {

                await navigator.share({
                    title:
                        "KaamKaro QR Code",

                    text:
                        "QR code created with KaamKaro."
                });

            } else {

                showError(
                    "Sharing is not supported in this browser. Please download the QR code instead."
                );

            }

        } catch (error) {

            console.log(
                "Share cancelled"
            );

        }

    }
);


</script>

<script src="../js/app.js"></script>
</body>

</html>
