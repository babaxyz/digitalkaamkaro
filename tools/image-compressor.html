<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Image Compressor - KaamKaro</title>

    <meta
        name="description"
        content="Compress images quickly and easily with KaamKaro."
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        .tool-page {
            max-width: 900px;
            margin: auto;
            padding: 60px 20px 100px;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .tool-header .tool-big-icon {
            width: 70px;
            height: 70px;
            margin: auto auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background: #e9fbf2;

            font-size: 32px;
        }

        .tool-header h2 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .tool-header p {
            color: var(--muted);
        }

        .compressor-box {
            background: white;
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: var(--shadow);
        }

        .upload-area {
            display: block;
            width: 100%;
            box-sizing: border-box;
            border: 2px dashed #d9d4f5;
            border-radius: 20px;
            padding: 55px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            background: #faf9ff;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: #f7f5ff;
        }

        .upload-icon {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .upload-area h3 {
            margin-bottom: 8px;
        }

        .upload-area p {
            color: var(--muted);
            font-size: 14px;
        }

        #fileInput {
            display: none;
        }

        .preview {
            display: none;
            margin-top: 25px;
        }

        .preview img {
            width: 100%;
            max-height: 350px;
            object-fit: contain;
            border-radius: 16px;
            background: #f5f5f8;
        }

        .file-info {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 15px;
            padding: 15px;
            background: #f7f7fb;
            border-radius: 14px;
            font-size: 14px;
        }

        .settings {
            display: none;
            margin-top: 25px;
        }

        .settings label {
            display: block;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .quality-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .quality-row input {
            flex: 1;
            accent-color: var(--primary);
        }

        #qualityValue {
            width: 55px;
            font-weight: 700;
            color: var(--primary);
        }

        .action-button {
            width: 100%;
            border: none;
            padding: 16px;
            margin-top: 22px;

            border-radius: 15px;

            background: var(--primary);
            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        .action-button:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .action-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f1fff7;
            border: 1px solid #cceedd;
            border-radius: 18px;
        }

        .result h3 {
            margin-bottom: 12px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .result-item {
            padding: 15px;
            background: white;
            border-radius: 12px;
        }

        .result-item small {
            display: block;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .download-button {
            display: block;
            width: 100%;
            text-align: center;

            margin-top: 18px;
            padding: 15px;

            border-radius: 14px;

            background: #171525;
            color: white;

            text-decoration: none;
            font-weight: 700;
        }

        .reset-button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;

            border: 1px solid var(--border);
            background: white;

            border-radius: 14px;

            cursor: pointer;
            font-weight: 600;
        }

        .error {
            display: none;

            margin-top: 15px;
            padding: 14px;

            background: #fff0f0;
            color: #c62828;

            border-radius: 12px;

            font-size: 14px;
        }

        @media (max-width: 600px) {

            .tool-page {
                padding-top: 40px;
            }

            .tool-header h2 {
                font-size: 30px;
            }

            .compressor-box {
                padding: 18px;
            }

            .upload-area {
                padding: 40px 15px;
            }

            .result-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<header class="header">

    <div class="logo">

        <a
            href="../index.html"
            style="
                text-decoration:none;
                color:inherit;
                display:flex;
                align-items:center;
                gap:12px;
            "
        >

            <div class="logo-icon">
                K
            </div>

            <div>

                <h1>KaamKaro</h1>

                <p>Digital Tools</p>

            </div>

        </a>

    </div>

</header>


<main>

    <section class="tool-page">

        <div class="tool-header">

            <div class="tool-big-icon">
                🖼️
            </div>

            <h2>
                Image Compressor
            </h2>

            <p>
                Reduce image size without uploading your image to a server.
            </p>
<button
    id="favoriteButton"
    class="favorite-button"
>
    ☆ Add to Favorites
</button>
        </div>


        <div class="compressor-box">

            <!-- UPLOAD -->

            <label
                class="upload-area"
                for="fileInput"
            >

                <div class="upload-icon">
                    📤
                </div>

                <h3>
                    Select an image
                </h3>

                <p>
                    JPG, JPEG, PNG or WebP
                </p>

                <p>
                    Click to browse
                </p>

            </label>


            <input
                type="file"
                id="fileInput"
                accept="image/jpeg,image/png,image/webp"
            >


            <!-- ERROR -->

            <div
                class="error"
                id="errorBox"
            ></div>


            <!-- PREVIEW -->

            <div
                class="preview"
                id="preview"
            >

                <img
                    id="previewImage"
                    alt="Selected image preview"
                >

                <div class="file-info">

                    <span>
                        Original
                    </span>

                    <strong id="originalSize">
                        -
                    </strong>

                </div>

            </div>


            <!-- SETTINGS -->

            <div
                class="settings"
                id="settings"
            >

                <label>
                    Compression Quality
                </label>

                <div class="quality-row">

                    <input
                        type="range"
                        id="quality"
                        min="10"
                        max="100"
                        value="75"
                    >

                    <span id="qualityValue">
                        75%
                    </span>

                </div>


                <button
                    class="action-button"
                    id="compressButton"
                >
                    Compress Image
                </button>

            </div>


            <!-- RESULT -->

            <div
                class="result"
                id="result"
            >

                <h3>
                    ✅ Compression Complete
                </h3>

                <div class="result-grid">

                    <div class="result-item">

                        <small>
                            Original Size
                        </small>

                        <strong id="resultOriginal">
                            -
                        </strong>

                    </div>


                    <div class="result-item">

                        <small>
                            New Size
                        </small>

                        <strong id="resultNew">
                            -
                        </strong>

                    </div>

                </div>


                <a
                    id="downloadButton"
                    class="download-button"
                    download="kaamkaro-compressed-image.jpg"
                >
                    Download Image
                </a>


                <button
                    class="reset-button"
                    id="resetButton"
                >
                    Compress Another Image
                </button>

            </div>

        </div>

    </section>

</main>


<script>

const fileInput =
    document.getElementById("fileInput");

const preview =
    document.getElementById("preview");

const previewImage =
    document.getElementById("previewImage");

const originalSize =
    document.getElementById("originalSize");

const settings =
    document.getElementById("settings");

const quality =
    document.getElementById("quality");

const qualityValue =
    document.getElementById("qualityValue");

const compressButton =
    document.getElementById("compressButton");

const result =
    document.getElementById("result");

const resultOriginal =
    document.getElementById("resultOriginal");

const resultNew =
    document.getElementById("resultNew");

const downloadButton =
    document.getElementById("downloadButton");

const resetButton =
    document.getElementById("resetButton");

const errorBox =
    document.getElementById("errorBox");


let selectedFile = null;
let compressedUrl = null;


function formatSize(bytes) {

    if (bytes < 1024) {
        return bytes + " B";
    }

    if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(1) + " KB";
    }

    return (
        bytes /
        (1024 * 1024)
    ).toFixed(2) + " MB";
}


function showError(message) {

    errorBox.textContent = message;

    errorBox.style.display = "block";
}


function hideError() {

    errorBox.style.display = "none";

}


quality.addEventListener(
    "input",
    () => {

        qualityValue.textContent =
            quality.value + "%";

    }
);


fileInput.addEventListener(
    "change",
    () => {

        hideError();

        const file =
            fileInput.files[0];

        if (!file) {
            return;
        }


        if (!file.type.startsWith("image/")) {

            showError(
                "Please select a valid image file."
            );

            return;
        }


        if (
            file.size >
            20 * 1024 * 1024
        ) {

            showError(
                "Please select an image smaller than 20 MB."
            );

            return;
        }


        selectedFile = file;


        const reader =
            new FileReader();


        reader.onload = function(event) {

            previewImage.src =
                event.target.result;

            preview.style.display =
                "block";

            settings.style.display =
                "block";

            result.style.display =
                "none";

            originalSize.textContent =
                formatSize(file.size);

        };


        reader.readAsDataURL(file);

    }
);


compressButton.addEventListener(
    "click",
    () => {

        if (!selectedFile) {
            return;
        }


        compressButton.disabled =
            true;

        compressButton.textContent =
            "Compressing...";


        const image =
            new Image();


        image.onload = function() {

            const canvas =
                document.createElement(
                    "canvas"
                );


            let width =
                image.width;

            let height =
                image.height;


            const maxDimension =
                3000;


            if (
                width >
                maxDimension ||
                height >
                maxDimension
            ) {

                const ratio =
                    Math.min(
                        maxDimension / width,
                        maxDimension / height
                    );

                width =
                    Math.round(
                        width * ratio
                    );

                height =
                    Math.round(
                        height * ratio
                    );

            }


            canvas.width =
                width;

            canvas.height =
                height;


            const context =
                canvas.getContext("2d");


            context.drawImage(
                image,
                0,
                0,
                width,
                height
            );


            const compressionQuality =
                Number(quality.value) / 100;


            canvas.toBlob(
                function(blob) {

                    if (!blob) {

                        showError(
                            "Compression failed. Please try another image."
                        );

                        compressButton.disabled =
                            false;

                        compressButton.textContent =
                            "Compress Image";

                        return;
                    }


                    if (compressedUrl) {

                        URL.revokeObjectURL(
                            compressedUrl
                        );

                    }


                    compressedUrl =
                        URL.createObjectURL(
                            blob
                        );


                    resultOriginal.textContent =
                        formatSize(
                            selectedFile.size
                        );


                    resultNew.textContent =
                        formatSize(
                            blob.size
                        );


                    downloadButton.href =
                        compressedUrl;


                    result.style.display =
                        "block";


                    compressButton.disabled =
                        false;

                    compressButton.textContent =
                        "Compress Image";

                },
                "image/jpeg",
                compressionQuality
            );

        };


        image.onerror =
            function() {

                showError(
                    "Could not read this image."
                );

                compressButton.disabled =
                    false;

                compressButton.textContent =
                    "Compress Image";

            };


        image.src =
            URL.createObjectURL(
                selectedFile
            );

    }
);


resetButton.addEventListener(
    "click",
    () => {

        if (compressedUrl) {

            URL.revokeObjectURL(
                compressedUrl
            );

            compressedUrl = null;

        }


        fileInput.value = "";

        selectedFile = null;

        preview.style.display =
            "none";

        settings.style.display =
            "none";

        result.style.display =
            "none";

        hideError();

        quality.value = 75;

        qualityValue.textContent =
            "75%";

    }
);

</script>
<script src="../js/app.js"></script>
</body>

</html>
